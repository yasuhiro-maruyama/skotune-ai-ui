                  description: ユーザーID
              required: [user_id]
    B004_001_Request_Post:
      title: B004_001_採点機能_楽曲予約情報BFF_リクエスト（POST）
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                user_id:
                  type: string
                  description: ユーザーID
                artist_id:
                  type: string
                  description: 歌手ID
                artist_name:
                  type: string
                  description: 歌手名
                tune_id:
                  type: string
                  description: 楽曲ID
                tune_name:
                  type: string
                  description: 楽曲名
                model_type:
                  type: string
                  description: 採点機種
                score:
                  type: number
                  description: 点数
                scoring_date:
                  type: string
                  description: 採点日
              required:
                [
                  user_id,
                  artist_id,
                  artist_name,
                  tune_id,
                  tune_name,
                  model_type,
                  score,
                  scoring_date,

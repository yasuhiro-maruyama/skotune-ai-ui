          properties:
            payload:
              type: object
              properties:
                user_id:
                  type: string
                  description: ユーザーID
                tune_id:
                  type: string
                  description: 楽曲ID
                tune_name:
                  type: string
                  description: 楽曲名
                model_type:
                  type: string
                  description: 採点機種
                score:
                  type: number
                  description: 点数
                scoring_date:
                  type: string
                  description: 採点日
                registered_model_type:
                  type: string
                  description: 登録済み採点機種
                registered_scoring_date:
                  type: string

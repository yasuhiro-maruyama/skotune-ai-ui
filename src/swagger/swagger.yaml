openapi: 3.0.0
info:
  title: skotune-ai BFF
  version: 1.0.0
paths:
  /api/bff:
    get:
      summary: B000_000_共通機能_ヘルスチェックBFF
      description: BFFサーバーが正常に稼働しているか確認
      responses:
        "200":
          description: 成功時のレスポンス
    post:
      summary: BFF統合エンドポイント
      description: |
        ifIdにより実行する処理を切り替え
        payloadの内容は各IFによって異なる
      requestBody:
        required: true
        content:
          application/json:
            schema:
              discriminator:
                propertyName: ifId
                mapping:
                  B000_001: "#/components/schemas/B000_001_Request"
              oneOf:
                - $ref: "#/components/schemas/B000_001_Request"
      responses:
        "200":
          description: 正常応答
          content:
            application/json:
              schema:
                discriminator:
                  propertyName: ifId
                  mapping:
                    B000_001: "#/components/schemas/B000_001_Response"
                oneOf:
                  - $ref: "#/components/schemas/B000_001_Response"
        "422":
          description: バリデーションエラー

components:
  schemas:
    BaseRequest:
      title: 共通リクエスト
      type: object
      properties:
        ifId:
          type: string
          description: IF-ID
        method:
          type: string
          description: HTTPメソッド
        payload:
          type: object
      required: [ifId, method, payload]

    B000_001_Request:
      title: B000_001_共通機能_メニュー情報BFF_リクエスト
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                administrator_flg:
                  type: boolean
                  description: 管理者フラグ
              required: [administrator_flg]

    BaseResponse:
      title: 共通レスポンス
      type: object
      properties:
        success_flg:
          type: boolean
          description: 正常終了フラグ
        code:
          type: string
          description: 結果コード
        message:
          type: string
          description: 結果メッセージ
      required: [success_flg, code]

    B000_001_Response:
      title: B000_001_共通機能_メニュー情報BFF_レスポンス
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            response_info:
              type: array
              items:
                type: object
                properties:
                  sort:
                    type: number
                    description: ソート順
                  label:
                    type: string
                    description: ラベル
                  icon:
                    type: string
                    description: アイコン
                  content:
                    type: string
                    description: 内容
                  administrator_flg:
                    type: boolean
                    description: 管理者フラグ

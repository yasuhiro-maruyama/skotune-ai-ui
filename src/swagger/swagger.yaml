      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                user_id:
                  type: string
                  description: ユーザーID
                password:
                  type: string
                  description: パスワード
              required: [user_id, password]

    B001_002_Request_Get:
      title: B001_002_認証機能_トークン情報BFF_リクエスト（GET）
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
    B001_002_Request_Delete:
      title: B001_002_認証機能_トークン情報BFF_リクエスト（DELETE）
      allOf:
        - $ref: "#/components/schemas/BaseRequest"

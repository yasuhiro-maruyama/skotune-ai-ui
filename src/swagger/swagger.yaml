openapi: 3.0.0
info:
  title: skotune-ai BFF
  version: 1.0.0
paths:
  /api/bff:
    get:
      summary: B000_000_共通機能_ヘルスチェックBFF
      description: BFFサーバーが正常に稼働しているか確認
      responses:
        "200":
          description: 成功時のレスポンス
    post:
      summary: BFF統合エンドポイント
      description: |
        ifIdにより実行する処理を切り替え
        payloadの内容は各IFによって異なる
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/B000_001_Request"
                - $ref: "#/components/schemas/B000_002_Request"
                - $ref: "#/components/schemas/B001_001_Request"
            examples:
              B000_001:
                summary: B000_001_共通機能_メニュー情報BFF_リクエスト
                value:
                  ifId: B000_001
                  method: get
                  payload:
                    administrator_flg: true
              B000_002:
                summary: B000_002_共通機能_コード値情報BFF_リクエスト
                value:
                  ifId: B000_002
                  method: get
                  payload:
                    code_id: "0001"
              B001_001:
                summary: B001_001_認証機能_ログイン照会BFF_リクエスト
                value:
                  ifId: B001_001
                  method: post
                  payload:
                    user_id: "test@gmail.com"
                    password: "test"
      responses:
        "200":
          description: 正常応答
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/B000_001_Response"
                  - $ref: "#/components/schemas/B000_002_Response"
                  - $ref: "#/components/schemas/B001_001_Response"
        "422":
          description: バリデーションエラー

components:
  schemas:
    BaseRequest:
      title: 共通リクエスト
      type: object
      properties:
        ifId:
          type: string
          description: IF-ID
        method:
          type: string
          description: HTTPメソッド
        payload:
          type: object
      required: [ifId, method, payload]

    B000_001_Request:
      title: B000_001_共通機能_メニュー情報BFF_リクエスト
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                administrator_flg:
                  type: boolean
                  description: 管理者フラグ
              required: [administrator_flg]

    B000_002_Request:
      title: B000_002_共通機能_コード値情報BFF_リクエスト
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                code_id:
                  type: string
                  description: コードID
              required: [code_id]

    B001_001_Request:
      title: B001_001_認証機能_ログイン照会BFF_リクエスト
      allOf:
        - $ref: "#/components/schemas/BaseRequest"
        - type: object
          properties:
            payload:
              type: object
              properties:
                user_id:
                  type: string
                  description: ユーザーID
                password:
                  type: string
                  description: パスワード
              required: [user_id, password]

    BaseResponse:
      title: 共通レスポンス
      type: object
      properties:
        success_flg:
          type: boolean
          description: 正常終了フラグ
        code:
          type: string
          description: 結果コード
        message:
          type: string
          description: 結果メッセージ
      required: [success_flg, code]

    B000_001_Response:
      title: B000_001_共通機能_メニュー情報BFF_レスポンス
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            response_info:
              type: array
              items:
                type: object
                properties:
                  sort:
                    type: number
                    description: ソート順
                  label:
                    type: string
                    description: ラベル
                  icon:
                    type: string
                    description: アイコン
                  content:
                    type: string
                    description: 内容
                  administrator_flg:
                    type: boolean
                    description: 管理者フラグ

    B000_002_Response:
      title: B000_002_共通機能_コード値情報BFF_レスポンス
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            response_info:
              type: array
              items:
                type: object
                properties:
                  code_value:
                    type: string
                    description: コード値
                  code_name:
                    type: string
                    description: コード名称

    B001_001_Response:
      title: B001_001_認証機能_ログイン照会BFF_レスポンス
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            response_info:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    description: ユーザーID
                  user_name:
                    type: string
                    description: ユーザー名称
                  administrator_flg:
                    type: boolean
                    description: 管理者フラグ

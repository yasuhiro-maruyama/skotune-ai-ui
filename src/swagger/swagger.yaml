                  description: 楽曲ID
                model_type:
                  type: string
                  description: 採点機種
                scoring_date:
                  type: string
                  description: 採点日
              required: [user_id, tune_id, model_type, scoring_date]

    BaseResponse:
      title: 共通レスポンス
      type: object
      properties:
        success_flg:
          type: boolean
          description: 正常終了フラグ
        code:
          type: string
          description: 結果コード
        message:
          type: string
          description: 結果メッセージ
      required: [success_flg, code]

    B000_001_Response_Get:
      title: B000_001_共通機能_メニュー情報BFF_レスポンス（GET）
      allOf:
        - $ref: "#/components/schemas/BaseResponse"
        - type: object
          properties:
            response_info:
              type: array
              items:
                type: object
                properties:
                  sort:
                    type: number
                    description: ソート順
                  label:
                    type: string
                    description: ラベル
                  icon:
                    type: string
                    description: アイコン
                  content:
                    type: string
                    description: 内容
                  administrator_flg:
                    type: boolean
